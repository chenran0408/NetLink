name: Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.9.4

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  release:
    if: github.repository == 'chenran0408/NetLink' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check release version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(awk '/^version:/ {print $2}' pubspec.yaml | tr -d '\r')
          test "$TAG" = "v${version%%+*}"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          echo "APP_VERSION=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${version##*+}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev

      - name: Install dependencies and generate translations
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/common/constant.dart lib/common/release_asset.dart lib/views/about.dart test/common/app_update_test.dart test/common/release_asset_test.dart test/tool/package_test.dart test/widgets/update_dialog_test.dart
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/l10n lib/common/constant.dart lib/common/release_asset.dart lib/views/about.dart test/common/app_update_test.dart test/common/release_asset_test.dart test/tool/package_test.dart test/widgets/update_dialog_test.dart
            git diff --cached --quiet || git commit -m 'build(l10n): generate netlink translations'
            git push origin HEAD:main
          fi

      - name: Analyze and test
        run: |
          dart format --output=none --set-exit-if-changed lib test tool plugins
          flutter analyze --no-fatal-infos
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
          dart run tool/test.dart -- --reporter expanded
          git restore pubspec.yaml

      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          printf 'keyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" > android/key.properties
          keytool -list -keystore android/app/keystore.jks -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD

      - name: Refresh trusted CA bundle
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build signed Android packages
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          TAG: ${{ inputs.tag }}
        run: dart tool/package.dart android --env stable --tag "$TAG" -v

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest -Ptarget-platform=android-arm64 -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

      - uses: actions/upload-artifact@v4
        with:
          name: netlink-android
          path: dist/
          if-no-files-found: error

      - name: Verify packages and checksums
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for arch in arm64 armv7 amd64; do
            case "$arch" in
              armv7) offset=1000 ;;
              arm64) offset=2000 ;;
              amd64) offset=5000 ;;
            esac
            code=$((APP_BUILD + offset))
            apk="dist/NetLink-dev-$APP_VERSION-android-$arch.apk"
            "$tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/signature.txt
            grep -Fqi '75327fd218d888e7affa935f01d39a6bfe2fa079d52b8373b1672899a2f25766' /tmp/signature.txt
            "$tools/aapt" dump badging "$apk" > /tmp/badging.txt
            grep -Fq "package: name='io.github.chenran0408.netlink'" /tmp/badging.txt
            grep -Fq "application-label:'NetLink'" /tmp/badging.txt
            grep -Fq "versionCode='$code'" /tmp/badging.txt
            grep -Fq "versionName='$APP_VERSION'" /tmp/badging.txt
          done
          cd dist
          sha256sum -c "NetLink-dev-$APP_VERSION-SHA256SUMS"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.apk dist/*-SHA256SUMS dist/manifest.json --target "$(git rev-parse HEAD)" --title "NetLink $APP_VERSION" --notes-file .github/netlink-release.md --latest
